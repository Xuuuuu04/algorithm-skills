0 $n$\uff0c\u8868\u793a\u6570\u5217\u957f\u5ea6\uff1b\u7b2c\u4e8c\u884c $n$ \u4e2a\u6570 $h_i$\uff0c\u8868\u793a\u6570\u5217\u3002","formatO":"\u5171 $t$ \u884c\uff0c\u6bcf\u4e00\u884c\u4e3a\u6bcf\u7ec4\u6570\u636e\u7b54\u6848\u3002","hint":"$1\\le t\\le1000$\uff0c$1\\le n\\le50$\u3002","locale":"zh-CN"},"content":{"name":"Penchick and Modern Monument","background":"","description":"Amidst skyscrapers in the bustling metropolis of Metro Manila, the newest Noiph mall in the Philippines has just been completed! The construction manager, Penchick, ordered a state-of-the-art monument to be built with $ n $ pillars.\n\nThe heights of the monument\u0027s pillars can be represented as an array $ h $ of $ n $ positive integers, where $ h_i $ represents the height of the $ i $ -th pillar for all $ i $ between $ 1 $ and $ n $ .\n\nPenchick wants the heights of the pillars to be in non-decreasing order, i.e. $ h_i \\le h_{i + 1} $ for all $ i $ between $ 1 $ and $ n - 1 $ . However, due to confusion, the monument was built such that the heights of the pillars are in non-increasing order instead, i.e. $ h_i \\ge h_{i + 1} $ for all $ i $ between $ 1 $ and $ n - 1 $ .\n\nLuckily, Penchick can modify the monument and do the following operation on the pillars as many times as necessary:\n\n- Modify the height of a pillar to any positive integer. Formally, choose an index $ 1\\le i\\le n $ and a positive integer $ x $ . Then, assign $ h_i := x $ .\n\nHelp Penchick determine the minimum number of operations needed to make the heights of the monument\u0027s pillars non-decreasing.","formatI":"Each test contains multiple test cases. The first line contains the number of test cases $ t $ ( $ 1 \\le t \\le 1000 $ ). The description of the test cases follows.\n\nThe first line of each test case contains a single integer $ n $ ( $ 1 \\leq n \\leq 50 $ ) \u2014 the number of pillars.\n\nThe second line of each test case contains $ n $ integers $ h_1, h_2, \\ldots, h_n $ ( $ 1 \\le h_i \\le n $ and $ h_i\\ge h_{i+1} $ ) \u2014 the height of the pillars.\n\nPlease take note that the given array $ h $ is non-increasing.\n\nNote that there are no constraints on the sum of $ n $ over all test cases.","formatO":"For each test case, output a single integer representing the minimum number of operations needed to make the heights of the pillars non-decreasing.","hint":"In the first test case, the initial heights of pillars are $ h = [5, 4, 3, 2, 1] $ .\n\n- In the first operation, Penchick changes the height of pillar $ 1 $ to $ h_1 := 2 $ .\n- In the second operation, he changes the height of pillar $ 2 $ to $ h_2 := 2 $ .\n- In the third operation, he changes the height of pillar $ 4 $ to $ h_4 := 4 $ .\n- In the fourth operation, he changes the height of pillar $ 5 $ to $ h_5 := 4 $ .\n\nAfter the operation, the heights of the pillars are $ h = [2, 2, 3, 4, 4] $ , which is non-decreasing. It can be proven that it is not possible for Penchick to make the heights of the pillars non-decreasing in fewer than $ 4 $ operations.\n\nIn the second test case, Penchick can make the heights of the pillars non-decreasing by modifying the height of pillar $ 3 $ to $ h_3 := 2 $ .\n\nIn the third test case, the heights of pillars are already non-decreasing, so no operations are required.","locale":"en"},"attachments":[],"showScore":false,"acceptSolution":false,"acceptLanguages":[5,1,2,28,3,4,11,12,27,34,7,25,8,33,15,14,19,30,31,32,21,22,17,9,16,13,23],"samples":[["3\n5\n5 4 3 2 1\n3\n2 2 1\n1\n1","4\n1\n0"]],"limits":{"time":[1000],"memory":[256000]},"vjudge":{"id":"2031A","link":"https:\/\/codeforces.com\/problemset\/problem\/2031\/A"},"translation":"### \u9898\u76ee\u63cf\u8ff0\n\n\u7ed9\u51fa\u957f\u5ea6\u4e3a $n$ \u7684**\u5355\u8c03\u4e0d\u589e**\u6570\u5217 $h$\uff0c\u4f60\u53ef\u4ee5\u8fdb\u884c\u82e5\u5e72\u6b21\u64cd\u4f5c\uff0c\u6bcf\u6b21\u64cd\u4f5c\u4e2d\uff0c\u4f60\u53ef\u4ee5\u9009\u62e9\u4efb\u610f\u4e00\u4e2a\u6570 $i$\uff0c\u5e76\u5c06 $h_i$ \u6539\u4e3a         <h1>CF2031A Penchick and Modern Monument</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    给出长度为 $n$ 的**单调不增**数列 $h$，你可以进行若干次操作，每次操作中，你可以选择任意一个数 $i$，并将 $h_i$ 改为任意一个数，目标是让数列 $h$ 变成**单调不降**的数列。请问最少需要多少次操作？
                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    第一行一个数 $t$，表示多测数据组数。

对于每组数据，第一行一个数 $n$，表示数列长度；第二行 $n$ 个数 $h_i$，表示数列。
                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    共 $t$ 行，每一行为每组数据答案。
                            </div>
        </section>

        <section>
            <h2>说明/提示</h2>
            <div>
                $1\le t\le1000$，$1\le n\le50$。
            </div>
        </section>    </article>
