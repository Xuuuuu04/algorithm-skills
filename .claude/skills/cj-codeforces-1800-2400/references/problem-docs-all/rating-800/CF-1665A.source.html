        <h1>CF1665A GCD vs LCM</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    本题有多测。  
给定一个正整数 $n$，求一组正整数 $a$, $b$, $c$, $d$，使得 $a+b+c+d=n$，并且 $\gcd(a,b) = \operatorname{lcm}(c,d)$。本题有 SPJ，求出任意一组即可。
                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    第一行一个正整数 $t$，表示测试数据组数，接下来 $t$ 行，每行一个正整数 $n$。
                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    对于每组数据，输出任意一组 $a$, $b$, $c$, $d$。数据保证一定有解。
                            </div>
        </section>

        <section>
            <h2>说明/提示</h2>
            <div>
                $4\le n\le 10^9$  
$1\le t\le 10^4$
            </div>
        </section>    </article>
