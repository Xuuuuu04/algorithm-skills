}]) = \\max([a_i, a_{i+1}, a_{i+2}]) - \\min([a_i, a_{i+1}, a_{i+2}]),\n$$\n\nwhere $\\operatorname{mex}(b)$ denotes the minimum excluded (MEX)$^{\\text{\u2217}}$ of the integers in $b$.\n\nYou have to determine whether you can make $a$ good after replacing each $-1$ in $a$ with a non-negative integer.\n\n$^{\\text{\u2217}}$The minimum excluded (MEX) of a collection of integers $b_1, b_2, \\ldots, b_k$ is defined as the smallest non-negative integer $x$ which does not occur in the collection $b$. For example, $\\operatorname{mex}([2,2,1])=0$ because $0$ does not belong to the array, and $\\operatorname{mex}([0,3,1,2])=4$ because $0$, $1$, $2$, and $3$ appear in the array, but $4$ does not.","formatI":"Each test contains multiple test cases. The first line contains the number of test cases $t$ ($1 \\le t \\le 500$). The description of the test cases follows.\n\nThe first line of each test case contains a single integer $n$ ($3 \\leq n \\leq 100$) \u2014 the length of $a$.\n\nThe second line contains $n$ integers $a_1,a_2,\\ldots,a_n$ ($-1 \\leq a_i \\leq 100$) \u2014 the elements of $a$. $a_i = -1$ denotes that this element is missing.","formatO":"For each test case, output \u0022YES\u0022 if it is possible to make $a$ good, and \u0022NO\u0022 otherwise.\n\nYou can output the answer in any case (upper or lower). For example, the strings \u0022yEs\u0022, \u0022yes\u0022, \u0022Yes\u0022, and \u0022YES\u0022 will be recognized as positive responses.","hint":"In the first test case, we can put $a_1 = a_2 = a_3 = 1$. Then,\n\n- $\\operatorname{mex}([a_1, a_2, a_3]) = \\operatorname{mex}([1, 1, 1]) = 0$;\n- $\\max([a_1, a_2, a_3]) = \\max([1, 1, 1]) = 1$;\n- $\\min([a_1, a_2, a_3]) = \\min([1, 1, 1]) = 1$.\n\nAnd $0 = 1 - 1$. Thus, the array $a$ is good.\n\nIn the second test case, none of the elements in $a$ is missing. And we have\n\n- $\\operatorname{mex}([a_1, a_2, a_3]) = \\max([a_1, a_2, a_3]) - \\min([a_1, a_2, a_3])$,\n- $\\operatorname{mex}([a_2, a_3, a_4]) = \\m
