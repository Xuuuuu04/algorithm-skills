        <h1>CF486A Calculating Function</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    对于一个正整数 $n$，定义函数 $f$ 为：

$$
f(n) = -1 + 2 - 3 + \dots + (-1)^{n} n
$$

你的任务是，对于给定的整数 $n$，计算 $f(n)$。
                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    一行包含一个正整数 $n$（$1 \leq n \leq 10^{15}$）。
                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    输出一行，表示 $f(n)$ 的值。
                            </div>
        </section>

        <section>
            <h2>说明/提示</h2>
            <div>
                $f(4) = -1 + 2 - 3 + 4 = 2$

$f(5) = -1 + 2 - 3 + 4 - 5 = -3$

            </div>
