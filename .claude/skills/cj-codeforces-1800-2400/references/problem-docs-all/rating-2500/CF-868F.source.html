        <h1>CF868F Yet Another Minimization Problem</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    给定一个序列 $a$，要把它分成 $k$ 个子段。每个子段的费用是其中相同元素的对数。求所有子段的费用之和的最小值。
                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    第一行输入 $n$（序列长度）和 $k$（需分子段数）。接下来一行有 $n$ 个数，第 $i$ 个数表示序列的第 $i$ 个元素 $a_i$。
                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    输出一个数，费用和的最小值。
                            </div>
        </section>

        <section>
            <h2>说明/提示</h2>
            <div>
                $2 \leq n \leq 10^5$，$2 \leq k \leq \min(n,20)$，$1 \leq a_i \leq n$ 。
            </div>
        </section>    </article>
