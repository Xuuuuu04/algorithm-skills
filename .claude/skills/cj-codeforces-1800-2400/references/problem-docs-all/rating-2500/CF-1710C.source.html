        <h1>CF1710C XOR Triangle</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    给你一个数 $n$，问：有多少对数 $0\leq a,b,c \leq n$ 满足 $a \oplus b,b \oplus c,a \oplus c$  。三个数字构成了一个非退化三角形，也就是两条短边之和大于第三边的长度。$\oplus$ 表示二进制下的异或操作。
                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    一个数字 $n$，表示给定的 $n$ 在二进制下的表示。
                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    输出答案 $\bmod 998244353$。
                            </div>
        </section>

        <section>
            <h2>说明/提示</h2>
            <div>
                $0 < n < 2^{200000}$。
            </div>
        </section>    </article>
