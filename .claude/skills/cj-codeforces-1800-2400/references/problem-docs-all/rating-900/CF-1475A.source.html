        <h1>CF1475A Odd Divisor</h1>

        
        <section>
            <h2>题目描述</h2>
            <div>
                                    给定一个正整数 $n$，如果 $n$ 有大于 $1$ 的奇因数，输出`YES`，否则输出`NO`。
                            </div>
        </section>

        <section>
            <h2>输入格式</h2>
            <div>
                                    第一行一个正整数 $t$ 表示数据组数。

接下来 $t$ 行，每行一个正整数 $n$。
                            </div>
        </section>

        <section>
            <h2>输出格式</h2>
            <div>
                                    $t$ 行，每行一个字符串表示答案。
### 注意事项
$1\le t\le10^4,1\le n\le10^{14}$。

输出的字符串不区分大小写。（所以你输出`yEs`也是阔以的）

translated by [wandering_trader](/user/270791)
                            </div>
        </section>
